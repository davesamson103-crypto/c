<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackbox AI Films - A Reflection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <header class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Blackbox AI Films</h1>
                <p class="hero-subtitle">A Reflection on Innovation</p>
                <p class="hero-description">
                    Exploring the journey of Blackbox Agents through 50 unique perspectives. 
                    Each film captures a moment in the evolution of AI-powered development.
                </p>
            </div>
            <div class="hero-stats">
                <div class="stat">
                    <span class="stat-number">50</span>
                    <span class="stat-label">Films</span>
                </div>
                <div class="stat">
                    <span class="stat-number">1</span>
                    <span class="stat-label">Vision</span>
                </div>
                <div class="stat">
                    <span class="stat-number">∞</span>
                    <span class="stat-label">Possibilities</span>
                </div>
            </div>
        </header>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All Films</button>
                <button class="filter-btn" data-filter="1-10">1-10</button>
                <button class="filter-btn" data-filter="11-20">11-20</button>
                <button class="filter-btn" data-filter="21-30">21-30</button>
                <button class="filter-btn" data-filter="31-40">31-40</button>
                <button class="filter-btn" data-filter="41-50">41-50</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search films..." />
            </div>
        </div>

        <!-- Films Grid -->
        <main class="films-grid" id="filmsGrid">
            <!-- Films will be dynamically inserted here -->
        </main>

        <!-- Modal for Full Video View -->
        <div class="modal" id="videoModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <div class="modal-video-container">
                    <iframe id="modalVideo" 
                            width="100%" 
                            height="100%" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalDescription"></p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Created with ❤️ for Blackbox AI</p>
            <p class="footer-link">
                <a href="https://youtube.com/playlist?list=PLlu5MpHMPNOZGqNduuy3KdgEF1dY2TLPv" target="_blank">
                    View Original Playlist
                </a>
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
